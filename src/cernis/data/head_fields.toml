# Who controls each field of a page's <head>, by site type (DESIGN.md section 5).
#
# History uses this to classify a head change: only AUTHOR fields changed is
# AUTHOR_METADATA; only PLATFORM fields (or the frame) is PLATFORM_RENDERING; any
# UNKNOWN field is UNCLASSIFIED. Field names are a snapshot's head field names:
# lang, title, canonical, json-ld, meta:charset, and meta:<attribute>:<key>
# (meta:name:description, meta:property:og:title).
#
# Raising `version` is a CHECKER change: it is part of the change classifier's
# version, recorded in every run and every diff.
#
# Each DEV entry names its source. The DEV editor guide
# (https://dev.to/p/editor_guide, read 2026-11-05) documents the front matter
# keys title ("the title of your article"), published, description
# ("description area in Twitter cards and open graph cards"), tags,
# canonical_url ("link for the canonical version of the content"), cover_image
# ("cover image for post, accepts a URL"), and series. The field names below were
# read from a real DEV article page (Views Measure Views, fetched in Session 6b
# and kept in the local cache), never from a guess. A field that neither the
# guide nor that page settles is UNKNOWN, and so is any field not listed.

version = 1

[site.wordpress]
default = "AUTHOR"
source = "A WordPress page is the author's throughout (DESIGN.md section 3, Actor)."

[site.owned]
default = "AUTHOR"
source = "An owned page is the author's throughout (DESIGN.md section 3, Actor)."

[site.generic]
default = "UNKNOWN"
source = "With no site type, Cernis cannot tell who controls any field."

[site.dev]
default = "UNKNOWN"
source = "A DEV field not listed here has not been confirmed either way."

# DEV: set from the front matter (AUTHOR).

[[site.dev.field]]
name = "canonical"
control = "AUTHOR"
source = "Editor guide, canonical_url: link for the canonical version of the content."

[[site.dev.field]]
name = "meta:property:og:description"
control = "AUTHOR"
source = "Editor guide, description: description area in Twitter cards and open graph cards."

[[site.dev.field]]
name = "meta:name:twitter:description"
control = "AUTHOR"
source = "Editor guide, description: description area in Twitter cards and open graph cards."

[[site.dev.field]]
name = "meta:name:description"
control = "AUTHOR"
source = "Editor guide, description; on the real page it holds the same value as og:description."

[[site.dev.field]]
name = "meta:property:og:title"
control = "AUTHOR"
source = "Editor guide, title: the title of your article; on the real page it is the title exactly."

[[site.dev.field]]
name = "meta:name:twitter:title"
control = "AUTHOR"
source = "Editor guide, title: the title of your article; on the real page it is the title exactly."

# DEV: generated by DEV (PLATFORM). No front matter key in the editor guide sets these.

[[site.dev.field]]
name = "meta:property:og:url"
control = "PLATFORM"
source = "DEV sets og:url to the DEV URL whatever canonical_url says (claim C-3's review, DESIGN.md section 8)."

[[site.dev.field]]
name = "meta:property:og:site_name"
control = "PLATFORM"
source = "DEV's site name; no front matter key sets it."

[[site.dev.field]]
name = "meta:property:og:type"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
pattern = "meta:property:forem:*"
control = "PLATFORM"
source = "Forem, DEV's software, describing the site; no front matter key sets them."

[[site.dev.field]]
pattern = "meta:name:*-script"
control = "PLATFORM"
source = "URLs of DEV's own script assets; no front matter key sets them."

[[site.dev.field]]
name = "meta:name:head-cached-at"
control = "PLATFORM"
source = "A timestamp of DEV's page cache; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:last-updated"
control = "PLATFORM"
source = "A time DEV writes when it renders the page; no front matter key sets it."

[[site.dev.field]]
name = "lang"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:charset"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:viewport"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:theme-color"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:application-name"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:apple-mobile-web-app-title"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:environment"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:user-signed-in"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:author-trust"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:robots"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:twitter:card"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:twitter:site"
control = "PLATFORM"
source = "DEV's own account; no front matter key sets it."

[[site.dev.field]]
name = "meta:name:twitter:widgets:new-embed-design"
control = "PLATFORM"
source = "DEV's template; no front matter key sets it."

# DEV: not settled by the guide or the page (UNKNOWN).

[[site.dev.field]]
name = "title"
control = "UNKNOWN"
source = "The author's title and DEV's ' - DEV Community' in one value; a change could be either."

[[site.dev.field]]
name = "meta:name:keywords"
control = "UNKNOWN"
source = "The author's tags and DEV's own words in one value; a change could be either."

[[site.dev.field]]
name = "meta:property:og:image"
control = "UNKNOWN"
source = "The cover_image when set, else an image DEV generates, both on DEV's image service; not settled."

[[site.dev.field]]
name = "meta:name:twitter:image:src"
control = "UNKNOWN"
source = "The cover_image when set, else an image DEV generates, both on DEV's image service; not settled."

[[site.dev.field]]
name = "meta:name:twitter:creator"
control = "UNKNOWN"
source = "From the author's DEV profile, not the front matter; the profile is neither documented here nor settled."

[[site.dev.field]]
name = "json-ld"
control = "UNKNOWN"
source = "The author's title and name mixed with DEV's dates and publisher; a change could be either."
